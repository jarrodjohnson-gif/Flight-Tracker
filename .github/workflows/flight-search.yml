name: Flight Search

# Runs a cheapest-date search on a GitHub-hosted runner, which has unrestricted
# outbound network access to the Google Flights endpoints the library calls.
# Results are written to the job summary and uploaded as JSON artifacts.

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin airport IATA code"
        required: true
        default: "PHX"
      destination:
        description: "Destination airport IATA code"
        required: true
        default: "JAX"
      compare_destination:
        description: "Optional second destination to price alongside (blank to skip)"
        required: false
        default: "MCO"
      from_date:
        description: "Earliest departure date (YYYY-MM-DD)"
        required: true
        default: "2026-11-05"
      to_date:
        description: "Latest departure date (YYYY-MM-DD)"
        required: true
        default: "2027-01-31"
      cabin_class:
        description: "Cabin class"
        required: false
        default: "ECONOMY"
        type: choice
        options:
          - ECONOMY
          - PREMIUM_ECONOMY
          - BUSINESS
          - FIRST
      max_stops:
        description: "Maximum stops"
        required: false
        default: "ANY"
        type: choice
        options:
          - ANY
          - NON_STOP
          - ONE_STOP
          - TWO_PLUS_STOPS
      days:
        description: >-
          Comma-separated departure days to include (e.g. friday,saturday).
          Blank includes every day.
        required: false
        default: "thursday,friday,saturday,sunday,monday"
      return_leg:
        description: >-
          Also price the return direction as its own one-way, so the two legs
          can be bought separately. true or false.
        required: false
        default: "true"
      trip_duration:
        description: >-
          Nights away, to also price the trip as a round trip (e.g. 7).
          Set to 0 to price one-way only.
        required: false
        default: "7"
      departure_window:
        description: >-
          Optional departure time window in 24h form, e.g. 18-23 for evening
          departures only. Blank includes every departure time.
        required: false
        default: ""
      top_n:
        description: "How many of the cheapest dates to report"
        required: false
        default: "15"
  push:
    branches: [ "claude/flight-search-phx-jax-0zr6nv" ]
    paths:
      - ".github/workflows/flight-search.yml"
      - "scripts/render_search_summary.py"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest

    # Inputs are passed through the environment rather than interpolated into
    # run blocks, so a crafted input value cannot reach the shell.
    env:
      ORIGIN: ${{ github.event.inputs.origin || 'PHX' }}
      DESTINATION: ${{ github.event.inputs.destination || 'JAX' }}
      COMPARE_DESTINATION: ${{ github.event.inputs.compare_destination || 'MCO' }}
      FROM_DATE: ${{ github.event.inputs.from_date || '2026-11-05' }}
      TO_DATE: ${{ github.event.inputs.to_date || '2027-01-31' }}
      CABIN_CLASS: ${{ github.event.inputs.cabin_class || 'ECONOMY' }}
      MAX_STOPS: ${{ github.event.inputs.max_stops || 'ANY' }}
      DAYS: ${{ github.event.inputs.days || 'thursday,friday,saturday,sunday,monday' }}
      TRIP_DURATION: ${{ github.event.inputs.trip_duration || '7' }}
      RETURN_LEG: ${{ github.event.inputs.return_leg || 'true' }}
      DEPARTURE_WINDOW: ${{ github.event.inputs.departure_window || '' }}
      TOP_N: ${{ github.event.inputs.top_n || '15' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build day-of-week filter
        id: dayfilter
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          valid = {
              "monday", "tuesday", "wednesday", "thursday",
              "friday", "saturday", "sunday",
          }
          raw = os.environ.get("DAYS", "")
          chosen = [d.strip().lower() for d in raw.split(",") if d.strip()]
          unknown = [d for d in chosen if d not in valid]
          if unknown:
              raise SystemExit(f"Unknown day(s) in DAYS: {', '.join(unknown)}")
          flags = [f"--{d}" for d in chosen]
          window = os.environ.get("DEPARTURE_WINDOW", "").strip()
          if window:
              flags += ["--time", window]
          print("flags=" + " ".join(flags))
          PY

      - name: Search cheapest dates
        run: |
          uv run fli dates "$ORIGIN" "$DESTINATION" \
            --from "$FROM_DATE" \
            --to "$TO_DATE" \
            --class "$CABIN_CLASS" \
            --stops "$MAX_STOPS" \
            --sort \
            ${{ steps.dayfilter.outputs.flags }} \
            --format json > dates.json

      - name: Search return leg
        if: env.RETURN_LEG == 'true'
        continue-on-error: true
        run: |
          uv run fli dates "$DESTINATION" "$ORIGIN" \
            --from "$FROM_DATE" \
            --to "$TO_DATE" \
            --class "$CABIN_CLASS" \
            --stops "$MAX_STOPS" \
            --sort \
            ${{ steps.dayfilter.outputs.flags }} \
            --format json > dates-return.json

      - name: Search return leg nonstop
        if: env.RETURN_LEG == 'true'
        continue-on-error: true
        run: |
          uv run fli dates "$DESTINATION" "$ORIGIN" \
            --from "$FROM_DATE" \
            --to "$TO_DATE" \
            --class "$CABIN_CLASS" \
            --stops NON_STOP \
            --sort \
            ${{ steps.dayfilter.outputs.flags }} \
            --format json > dates-return-nonstop.json

      - name: Pick the cheapest return nonstop date
        id: return_nonstop
        if: env.RETURN_LEG == 'true'
        continue-on-error: true
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os.path

          dates = []
          path = "dates-return-nonstop.json"
          if os.path.exists(path) and os.path.getsize(path):
              try:
                  dates = (json.loads(open(path).read()).get("dates")) or []
              except json.JSONDecodeError:
                  dates = []
          print(f"date={min(dates, key=lambda d: d['price'])['departure_date']}" if dates else "date=")
          PY

      - name: Search return nonstop flights
        if: steps.return_nonstop.outputs.date != ''
        continue-on-error: true
        env:
          RETURN_NONSTOP_DATE: ${{ steps.return_nonstop.outputs.date }}
        run: |
          uv run fli flights "$DESTINATION" "$ORIGIN" "$RETURN_NONSTOP_DATE" \
            --class "$CABIN_CLASS" \
            --stops NON_STOP \
            --sort CHEAPEST \
            --format json > flights-return-nonstop.json

      - name: Search round trip
        if: env.TRIP_DURATION != '' && env.TRIP_DURATION != '0'
        continue-on-error: true
        run: |
          uv run fli dates "$ORIGIN" "$DESTINATION" \
            --from "$FROM_DATE" \
            --to "$TO_DATE" \
            --class "$CABIN_CLASS" \
            --stops "$MAX_STOPS" \
            --round \
            --duration "$TRIP_DURATION" \
            --sort \
            ${{ steps.dayfilter.outputs.flags }} \
            --format json > dates-roundtrip.json

      - name: Search cheapest nonstop dates
        continue-on-error: true
        run: |
          uv run fli dates "$ORIGIN" "$DESTINATION" \
            --from "$FROM_DATE" \
            --to "$TO_DATE" \
            --class "$CABIN_CLASS" \
            --stops NON_STOP \
            --sort \
            ${{ steps.dayfilter.outputs.flags }} \
            --format json > dates-nonstop.json

      - name: Pick the cheapest date
        id: cheapest
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          payload = json.loads(open("dates.json").read())
          dates = payload.get("dates") or []
          if dates:
              cheapest = min(dates, key=lambda d: d["price"])
              print(f"date={cheapest['departure_date']}")
              print(f"price={cheapest['price']:.0f}")
              print(f"currency={cheapest['currency']}")
          else:
              print("date=")
          PY

      - name: Search flights on the cheapest date
        if: steps.cheapest.outputs.date != ''
        env:
          CHEAPEST_DATE: ${{ steps.cheapest.outputs.date }}
        run: |
          uv run fli flights "$ORIGIN" "$DESTINATION" "$CHEAPEST_DATE" \
            --class "$CABIN_CLASS" \
            --stops "$MAX_STOPS" \
            --sort CHEAPEST \
            --format json > flights.json

      - name: Pick the cheapest nonstop date
        id: cheapest_nonstop
        continue-on-error: true
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os.path

          path = "dates-nonstop.json"
          dates = []
          if os.path.exists(path) and os.path.getsize(path):
              try:
                  payload = json.loads(open(path).read())
                  dates = payload.get("dates") or []
              except json.JSONDecodeError:
                  dates = []
          if dates:
              cheapest = min(dates, key=lambda d: d["price"])
              print(f"date={cheapest['departure_date']}")
          else:
              print("date=")
          PY

      - name: Search nonstop flights on that date
        if: steps.cheapest_nonstop.outputs.date != ''
        continue-on-error: true
        env:
          CHEAPEST_NONSTOP_DATE: ${{ steps.cheapest_nonstop.outputs.date }}
        run: |
          uv run fli flights "$ORIGIN" "$DESTINATION" "$CHEAPEST_NONSTOP_DATE" \
            --class "$CABIN_CLASS" \
            --stops NON_STOP \
            --sort CHEAPEST \
            --format json > flights-nonstop.json

      - name: Search alternate destination
        if: env.COMPARE_DESTINATION != '' && env.COMPARE_DESTINATION != env.DESTINATION
        continue-on-error: true
        run: |
          uv run fli dates "$ORIGIN" "$COMPARE_DESTINATION" \
            --from "$FROM_DATE" \
            --to "$TO_DATE" \
            --class "$CABIN_CLASS" \
            --stops "$MAX_STOPS" \
            --sort \
            ${{ steps.dayfilter.outputs.flags }} \
            --format json > dates-compare.json

      - name: Pick the cheapest alternate date
        id: cheapest_compare
        continue-on-error: true
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os.path

          path = "dates-compare.json"
          dates = []
          if os.path.exists(path) and os.path.getsize(path):
              try:
                  dates = (json.loads(open(path).read()).get("dates")) or []
              except json.JSONDecodeError:
                  dates = []
          print(f"date={min(dates, key=lambda d: d['price'])['departure_date']}" if dates else "date=")
          PY

      - name: Search alternate destination flights
        if: steps.cheapest_compare.outputs.date != ''
        continue-on-error: true
        env:
          COMPARE_DATE: ${{ steps.cheapest_compare.outputs.date }}
        run: |
          uv run fli flights "$ORIGIN" "$COMPARE_DESTINATION" "$COMPARE_DATE" \
            --class "$CABIN_CLASS" \
            --stops "$MAX_STOPS" \
            --sort CHEAPEST \
            --format json > flights-compare.json

      - name: Write job summary
        if: always()
        run: uv run python scripts/render_search_summary.py

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flight-search-results
          path: |
            dates.json
            flights.json
            dates-nonstop.json
            flights-nonstop.json
            dates-compare.json
            flights-compare.json
            dates-roundtrip.json
            dates-return.json
            dates-return-nonstop.json
            flights-return-nonstop.json
          if-no-files-found: warn
