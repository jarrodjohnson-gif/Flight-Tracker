name: Flight Price Checker

on:
  schedule:
    # Every 6 hours — Google Flights data refreshes ~4x/day
    - cron: "0 */6 * * *"
  workflow_dispatch: # also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install flights httpx

      - name: Run price checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python webui/checker.py

      - name: Commit updated watches.json
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add webui/watches.json
          git diff --staged --quiet || git commit -m "chore: update price check results [skip ci]"
          git push
